<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>InstaKarusel AI PRO V7</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- React & Tailwind & Babel (pinned versions) -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>

<body class="text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- SVGs pre UI ---
        const Icons = {
            Sparkles: () => <svg className="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9.813 15.904L9 21l-1.81-5.096L2.1 14.1 7.19 12.3 9 7.19l1.81 5.11 5.096 1.81-5.096 1.81zM19.071 4.929l-.707 1.98-.707-1.98-1.98-.707 1.98-.707.707-1.98.707 1.98 1.98.707-1.98.707z"></path></svg>,
            Download: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>,
            Plus: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"></path></svg>,
            Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>,
            Instagram: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>,
            Upload: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>,
            ArrowLeft: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>,
            ArrowRight: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>,
            Save: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>,
            Search: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>,
            ChevronDown: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7"></path></svg>,
            ChevronUp: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 15l7-7 7 7"></path></svg>,
            Image: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>,
            Key: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
        };

        // API kľúč bol odstránený z global scope — načítava sa z localStorage cez React State

        const INITIAL_SLIDES = [
          {
            type: "cover",
            title: "REGULÁCIA VÁPNIKA",
            bullets: ["Bunkové dráhy", "Prevencia zápalu"],
            imageLayout: "none",
            image: null
          },
          {
            type: "content",
            title: "MECHANIZMUS ÚČINKU",
            content: "**Regulácia vápnika v bunkách:** Mechanizmus účinku spočíva v ovplyvnení tzv. \"vápnikových dráh\" (signálna cesta STIM1/Orai1/NFAT3). Nadmerný vstup vápnika do buniek totiž vedie k ich poškodeniu a nekontrolovanému rastu tkaniva.\n\n**Menej zápalu a bunkovej smrti:** Okrem boja proti hypertrofii táto látka významne chráni bunky.",
            imageLayout: "center-right",
            image: null
          }
        ];

        const LAYOUT_OPTIONS = [
            { id: 'top-left', label: 'Hore Vľavo' }, { id: 'top-center', label: 'Hore Stred' }, { id: 'top-right', label: 'Hore Vpravo' },
            { id: 'center-left', label: 'Stred Vľavo' }, { id: 'center-center', label: 'Stred' }, { id: 'center-right', label: 'Stred Vpravo' },
            { id: 'bottom-left', label: 'Dole Vľavo' }, { id: 'bottom-center', label: 'Dole Stred' }, { id: 'bottom-right', label: 'Dole Vpravo' },
            { id: 'none', label: 'Žiadny obrázok' }
        ];

        // Bezpečné sanitovanie HTML pre dangerouslySetInnerHTML (ochrana proti XSS)
        const sanitizeHtml = (html) => {
            return html
                .replace(/<script[\s\S]*?<\/script>/gi, '')
                .replace(/on\w+="[^"]*"/gi, '')
                .replace(/on\w+='[^']*'/gi, '')
                .replace(/<iframe[\s\S]*?<\/iframe>/gi, '');
        };

        function App() {
          // ✅ FIX: API kľúč v React State, načítaný z localStorage
          const [apiKey, setApiKey] = useState(() => localStorage.getItem('insta_v7_apiKey') || "");
          const [showApiKey, setShowApiKey] = useState(false);

          const [slides, setSlides] = useState(() => {
            try {
              const saved = localStorage.getItem('insta_v7_slides');
              return saved ? JSON.parse(saved) : INITIAL_SLIDES;
            } catch {
              // Ochrana pred korumpovaným JSON v localStorage
              return INITIAL_SLIDES;
            }
          });
          const [activeIndex, setActiveIndex] = useState(0);

          const [instagramHandle, setInstagramHandle] = useState(() => localStorage.getItem('insta_v7_handle') || "@tvoj_profil");
          const [brandColor, setBrandColor] = useState(() => localStorage.getItem('insta_v7_color') || "#3b82f6");
          const [bgColor, setBgColor] = useState(() => localStorage.getItem('insta_v7_bgColor') || "#0b0f19");
          const [avatarPreview, setAvatarPreview] = useState(() => localStorage.getItem('insta_v7_avatar') || "");

          const [topic, setTopic] = useState("");
          const [loading, setLoading] = useState(false);
          const [apiError, setApiError] = useState("");
          const [saveSuccess, setSaveSuccess] = useState(false);

          const [editTitle, setEditTitle] = useState("");
          const [editContent, setEditContent] = useState("");
          const [editBullets, setEditBullets] = useState("");

          const [imagePrompt, setImagePrompt] = useState("");
          const [imgLoading, setImgLoading] = useState(false);

          const [pubMedQuery, setPubMedQuery] = useState("");
          const [pubMedOptimizedQuery, setPubMedOptimizedQuery] = useState("");
          const [pubMedResults, setPubMedResults] = useState("");
          const [isFetchingPubMed, setIsFetchingPubMed] = useState(false);
          const [isPubMedOpen, setIsPubMedOpen] = useState(false);
          const [pubMedLinks, setPubMedLinks] = useState([]);

          const canvasRef = useRef(null);
          const fileInputRef = useRef(null);
          const slideImageFileInputRef = useRef(null);
          const imageCache = useRef({});

          // ✅ FIX: Ukladanie API kľúča do localStorage
          useEffect(() => { localStorage.setItem('insta_v7_apiKey', apiKey); }, [apiKey]);
          useEffect(() => { localStorage.setItem('insta_v7_slides', JSON.stringify(slides)); }, [slides]);
          useEffect(() => { localStorage.setItem('insta_v7_handle', instagramHandle); }, [instagramHandle]);
          useEffect(() => { localStorage.setItem('insta_v7_color', brandColor); }, [brandColor]);
          useEffect(() => { localStorage.setItem('insta_v7_bgColor', bgColor); }, [bgColor]);
          useEffect(() => { localStorage.setItem('insta_v7_avatar', avatarPreview); }, [avatarPreview]);

          useEffect(() => {
            if (slides[activeIndex]) {
              setEditTitle(slides[activeIndex].title || "");
              setEditContent(slides[activeIndex].content || "");
              setEditBullets(slides[activeIndex].bullets ? slides[activeIndex].bullets.join(", ") : "");
            }
          }, [activeIndex, slides]);

          useEffect(() => {
            const timer = setTimeout(() => {
                if (!slides[activeIndex]) return;
                const updated = [...slides];
                updated[activeIndex] = {
                  ...updated[activeIndex],
                  title: editTitle.toUpperCase(),
                  content: editContent,
                  bullets: editBullets ? editBullets.split(",").map(b => b.trim()) : undefined
                };
                setSlides(updated);
            }, 300);
            return () => clearTimeout(timer);
          }, [editTitle, editContent, editBullets]);

          // ✅ Helper: guard pre prázdny API kľúč
          const requireApiKey = () => {
            if (!apiKey.trim()) {
              setApiError("⚠️ Chýba Gemini API kľúč. Vlož ho v sekcii 'Nastavenie Profilu'.");
              return false;
            }
            return true;
          };

          const addBlankSlide = () => {
            const newSlide = {
              type: "content",
              title: "",
              content: "",
              imageLayout: "none",
              image: null
            };
            const updated = [...slides, newSlide];
            setSlides(updated);
            setActiveIndex(updated.length - 1);
          };

          const handleAvatarChange = (e) => {
            const file = e.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onloadend = () => setAvatarPreview(reader.result);
              reader.readAsDataURL(file);
            }
          };

          const handleSlideImageUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onloadend = () => {
                const updated = [...slides];
                updated[activeIndex] = {
                  ...updated[activeIndex],
                  image: reader.result,
                  imageLayout: updated[activeIndex].imageLayout === 'none' ? 'center-right' : updated[activeIndex].imageLayout
                };
                setSlides(updated);
              };
              reader.readAsDataURL(file);
            }
          };

          const setSlideLayout = (e) => {
            const layout = e.target.value;
            const updated = [...slides];
            updated[activeIndex].imageLayout = layout;
            if (layout === 'none') updated[activeIndex].image = null;
            setSlides(updated);
          };

          const generateNanobananaImage = async () => {
            if (!imagePrompt.trim()) { setApiError("Zadaj slovný popis pre obrázok."); return; }
            if (!requireApiKey()) return;
            setImgLoading(true); setApiError("");

            const userPrompt = `Minimalist flat vector icon graphic of: ${imagePrompt}, isolated on a clean elegant background, very simple modern style, 2d design`;

            try {
                // ✅ Model: gemini-2.5-flash-preview-05-20 je aktuálny odporúčaný pre image generation
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    contents: [{ parts: [{ text: userPrompt }] }],
                    generationConfig: { responseModalities: ["IMAGE", "TEXT"] }
                  })
                });

                if (!response.ok) {
                  const errData = await response.json().catch(() => ({}));
                  throw new Error(errData?.error?.message || `HTTP ${response.status}`);
                }
                const data = await response.json();

                const base64Data = data.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                if (base64Data) {
                  const finalImageUrl = `data:image/png;base64,${base64Data}`;
                  const updated = [...slides];
                  updated[activeIndex] = {
                    ...updated[activeIndex],
                    image: finalImageUrl,
                    imageLayout: updated[activeIndex].imageLayout === 'none' ? 'center-right' : updated[activeIndex].imageLayout
                  };
                  setSlides(updated);
                  setImagePrompt("");
                } else {
                    throw new Error("Obrázok nebol vygenerovaný — skontroluj, či má tvoj API kľúč povolené image generation.");
                }
            } catch (e) {
                setApiError("AI Obrázok zlyhal: " + e.message);
            } finally {
                setImgLoading(false);
            }
          };

          const searchPubMed = async () => {
            if (!pubMedQuery.trim()) { setApiError("Zadaj tému na výskum."); return; }
            if (!requireApiKey()) return;
            setIsFetchingPubMed(true); setApiError(""); setPubMedResults(""); setPubMedLinks([]); setPubMedOptimizedQuery("");

            try {
                // ✅ Model: gemini-2.0-flash — stabilný
                const optRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Translate and optimize this user query into a highly specific English search query for the PubMed database. Use appropriate boolean operators (AND, OR) if needed. Return ONLY the English search query string, nothing else. User query: "${pubMedQuery}"` }] }]
                    })
                });

                if (!optRes.ok) {
                  const errData = await optRes.json().catch(() => ({}));
                  throw new Error(errData?.error?.message || `HTTP ${optRes.status}`);
                }
                const optData = await optRes.json();
                const optimizedSearchTerm = optData.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || pubMedQuery;
                setPubMedOptimizedQuery(optimizedSearchTerm);

                const searchRes = await fetch(`https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term=${encodeURIComponent(optimizedSearchTerm)}&retmode=json&retmax=4`);
                if (!searchRes.ok) throw new Error("Nepodarilo sa pripojiť k PubMed.");
                const searchData = await searchRes.json();
                const ids = searchData.esearchresult.idlist;

                if (!ids || ids.length === 0) {
                    setPubMedResults(`Nenašli sa žiadne štúdie pre termín: ${optimizedSearchTerm}`);
                    setIsFetchingPubMed(false);
                    return;
                }

                const links = ids.map(id => `https://pubmed.ncbi.nlm.nih.gov/${id}/`);
                setPubMedLinks(links);

                const fetchRes = await fetch(`https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=${ids.join(',')}&retmode=xml`);
                const xmlText = await fetchRes.text();

                const summaryPrompt = `Tu sú abstrakty štúdií z databázy PubMed k téme "${pubMedQuery}":\n\n${xmlText.substring(0, 8000)}\n\nVytvor stručný výťah najdôležitejších záverov v slovenčine. Zásadné pravidlo: Vysvetli to ľudskou rečou pre laikov, vyhni sa ťažkým medicínskym termínom (alebo ich hneď vysvetli). Zvýrazni (**tučným písmom**) tie najzaujímavejšie fakty a vety, ktoré sú vyslovene ideálne pre priame použitie a skopírovanie do Instagram slidov. Čerpaj len z poskytnutého textu.`;

                // ✅ Model: gemini-2.0-flash — stabilný
                const aiRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: summaryPrompt }] }] })
                });

                if (!aiRes.ok) {
                  const errData = await aiRes.json().catch(() => ({}));
                  throw new Error(errData?.error?.message || `HTTP ${aiRes.status}`);
                }
                const aiData = await aiRes.json();
                const summaryText = aiData.candidates?.[0]?.content?.parts?.[0]?.text;
                setPubMedResults(summaryText || "Nepodarilo sa vygenerovať sumár.");

            } catch (e) {
                setApiError("PubMed chyba: " + e.message);
            } finally {
                setIsFetchingPubMed(false);
            }
          };

          const generateWithAI = async () => {
            if (!topic.trim()) { setApiError("Zadaj najprv tému."); return; }
            if (!requireApiKey()) return;
            setLoading(true); setApiError("");

            const userQuery = `Vytvor kompletný Instagram karusel v slovenčine na tému: "${topic}".
            Karusel musí mať 5 slidov. Vráť iba čistý JSON objekt podľa schémy:
            { "slides": [ { "type": "cover"|"content"|"outro", "title": "...", "bullets": ["..."], "content": "..." } ] }`;

            const systemPrompt = `Si copywriter pre Instagram. Generuj JSON pre karusel.
            ZÁSADNÉ PRAVIDLO PRE 'content' (obsah slidu):
            Text musí byť presne v tejto dĺžke a štruktúre. Toto je tvoj vzor:
            "**Regulácia vápnika v bunkách:** Mechanizmus účinku spočíva v ovplyvnení tzv. "vápnikových dráh" (signálna cesta STIM1/Orai1/NFAT3). Nadmerný vstup vápnika do buniek totiž vedie k ich poškodeniu a nekontrolovanému rastu tkaniva.
            **Menej zápalu a bunkovej smrti:** Okrem boja proti hypertrofii táto látka významne chráni bunky."
            (Zvýrazňuj kľúčové frázy do **dvojitých hviezdičiek**). Píš overene a vecne, presne v rozsahu 3-4 stručných viet. Nikdy negeneruj siahodlhé texty.`;

            try {
              // ✅ Model: gemini-2.0-flash — stabilný
              const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: userQuery }] }],
                  systemInstruction: { parts: [{ text: systemPrompt }] },
                  generationConfig: { responseMimeType: "application/json" }
                })
              });

              if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData?.error?.message || `HTTP ${response.status}`);
              }
              const data = await response.json();
              const text = data.candidates?.[0]?.content?.parts?.[0]?.text;

              if (text) {
                // ✅ FIX: Robustné čistenie markdown wrappera pred JSON.parse
                const cleanJson = text
                  .replace(/^```json\s*/i, '')
                  .replace(/^```\s*/i, '')
                  .replace(/\s*```$/i, '')
                  .trim();

                const parsed = JSON.parse(cleanJson);

                if (parsed.slides && Array.isArray(parsed.slides)) {
                  const formatted = parsed.slides.map(s => ({
                    ...s,
                    imageLayout: s.type === 'cover' ? 'none' : 'center-right',
                    image: null
                  }));
                  setSlides(formatted);
                  setActiveIndex(0);
                } else {
                  throw new Error("AI vrátila neplatný formát slidov.");
                }
              } else {
                throw new Error("AI nevrátila žiadny obsah.");
              }
            } catch (e) {
              setApiError("Chyba pri generovaní obsahu: " + e.message);
            } finally {
              setLoading(false);
            }
          };

          const parseMarkdownBold = (text) => {
            const regex = /\*\*([^*]+)\*\*/g;
            const tokens = [];
            let lastIndex = 0; let match;
            while ((match = regex.exec(text)) !== null) {
              if (match.index > lastIndex) tokens.push({ text: text.substring(lastIndex, match.index), isBold: false });
              tokens.push({ text: match[1], isBold: true });
              lastIndex = regex.lastIndex;
            }
            if (lastIndex < text.length) tokens.push({ text: text.substring(lastIndex), isBold: false });
            return tokens;
          };

          const drawSlideToCanvas = (slideIndex, callback = null) => {
            const canvas = canvasRef.current;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const slide = slides[slideIndex];
            if (!slide) return;

            const width = 1080; const height = 1350;
            canvas.width = width; canvas.height = height;

            ctx.fillStyle = bgColor; ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.015)';
            for (let x = 40; x < width; x += 80) {
              for (let y = 40; y < height; y += 80) {
                ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill();
              }
            }
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(80, 120); ctx.lineTo(width - 80, 120); ctx.stroke();

            const layout = slide.imageLayout || 'none';
            const hasImage = slide.image && layout !== 'none';
            const imgSize = 360;

            let imgX = 0, imgY = 0;
            if (layout.includes('left')) imgX = 80;
            else if (layout.includes('right')) imgX = width - 80 - imgSize;
            else imgX = (width - imgSize) / 2;

            if (layout.includes('top')) imgY = 240;
            else if (layout.includes('bottom')) imgY = 800;
            else imgY = (height - imgSize) / 2;

            let textX = 80;
            let textMaxWidth = width - 160;
            let titleY = 230;

            if (hasImage) {
                if (layout.includes('left')) { textX = imgX + imgSize + 40; textMaxWidth = width - textX - 80; }
                else if (layout.includes('right')) { textMaxWidth = width - 160 - imgSize - 40; }
                else if (layout.includes('top')) { titleY = imgY + imgSize + 50; }
                else if (layout.includes('center-center')) { textMaxWidth = width - 160; }
            }

            const drawImageWithPromise = () => {
              return new Promise((resolve) => {
                if (!hasImage || !slide.image) { resolve(); return; }
                const renderImg = (imgObj) => {
                  ctx.save();
                  ctx.beginPath(); ctx.roundRect(imgX, imgY, imgSize, imgSize, 24); ctx.clip();
                  const imgRatio = imgObj.width / imgObj.height;
                  let drawW = imgSize, drawH = imgSize, drawX = imgX, drawY = imgY;
                  if (imgRatio > 1) { drawW = imgSize * imgRatio; drawX = imgX - (drawW - imgSize) / 2; }
                  else { drawH = imgSize / imgRatio; drawY = imgY - (drawH - imgSize) / 2; }
                  ctx.drawImage(imgObj, drawX, drawY, drawW, drawH);
                  ctx.restore();
                  ctx.strokeStyle = brandColor; ctx.lineWidth = 3;
                  ctx.beginPath(); ctx.roundRect(imgX, imgY, imgSize, imgSize, 24); ctx.stroke();
                  resolve();
                };
                if (imageCache.current[slide.image] && imageCache.current[slide.image].complete) {
                  renderImg(imageCache.current[slide.image]);
                } else {
                  const img = new Image(); img.crossOrigin = "anonymous"; img.src = slide.image;
                  img.onload = () => { imageCache.current[slide.image] = img; renderImg(img); };
                  img.onerror = () => resolve();
                }
              });
            };

            const renderTextBlock = () => {
                ctx.fillStyle = '#ffffff';
                if (slide.type === 'cover') {
                  ctx.fillStyle = brandColor; ctx.font = 'bold 24px system-ui'; ctx.fillText('DÔLEŽITÁ SÉRIA', textX, titleY - 145);
                  ctx.fillStyle = '#ffffff'; ctx.font = '900 78px system-ui';
                  const titleWords = (slide.title || '').split(' ');
                  let currentTitleLine = ''; let currY = titleY;
                  for (let i = 0; i < titleWords.length; i++) {
                     let testLine = currentTitleLine + titleWords[i] + ' ';
                     if (ctx.measureText(testLine).width > textMaxWidth && i > 0) {
                         ctx.fillText(currentTitleLine.trim(), textX, currY);
                         currentTitleLine = titleWords[i] + ' '; currY += 85;
                     } else { currentTitleLine = testLine; }
                  }
                  ctx.fillText(currentTitleLine.trim(), textX, currY);

                  ctx.fillStyle = brandColor; ctx.fillRect(textX, currY + 50, 150, 10);

                  if (slide.bullets && slide.bullets.length > 0) {
                      let bY = currY + 150;
                      slide.bullets.forEach(b => {
                        ctx.fillStyle = brandColor; ctx.beginPath(); ctx.arc(textX + 20, bY - 12, 10, 0, Math.PI * 2); ctx.fill();
                        ctx.fillStyle = '#f1f5f9'; ctx.font = 'bold 32px system-ui'; ctx.fillText(b, textX + 50, bY);
                        bY += 70;
                      });
                  }
                } else {
                  ctx.fillStyle = brandColor; ctx.font = 'bold 32px system-ui'; ctx.fillText(`0${slideIndex}`, textX, titleY - 145);
                  ctx.fillStyle = '#ffffff'; ctx.font = '900 62px system-ui';
                  const titleWords = (slide.title || '').split(' ');
                  let currentTitleLine = ''; let currY = titleY;
                  for (let i = 0; i < titleWords.length; i++) {
                     let testLine = currentTitleLine + titleWords[i] + ' ';
                     if (ctx.measureText(testLine).width > textMaxWidth && i > 0) {
                         ctx.fillText(currentTitleLine.trim(), textX, currY);
                         currentTitleLine = titleWords[i] + ' '; currY += 70;
                     } else { currentTitleLine = testLine; }
                  }
                  ctx.fillText(currentTitleLine.trim(), textX, currY);

                  const content = slide.content || '';
                  const paragraphs = content.split('\n');
                  let textBodyY = currY + 110;

                  paragraphs.forEach(paragraph => {
                    if(!paragraph.trim()) { textBodyY += 25; return; }
                    const tokens = parseMarkdownBold(paragraph);
                    let currentX = textX;
                    tokens.forEach(token => {
                      const words = token.text.split(' ');
                      words.forEach((word, wordIdx) => {
                        if (word === '' && wordIdx > 0) return;
                        const wordWithSpace = word + (wordIdx < words.length - 1 ? ' ' : '');
                        ctx.font = `${token.isBold ? '900' : 'normal'} 34px system-ui`;
                        const wordWidth = ctx.measureText(wordWithSpace).width;

                        if (currentX + wordWidth > textX + textMaxWidth) {
                          currentX = textX; textBodyY += 55;
                        }
                        ctx.fillStyle = token.isBold ? '#ffffff' : '#d1d5db';
                        ctx.fillText(wordWithSpace, currentX, textBodyY);
                        currentX += wordWidth;
                      });
                    });
                    textBodyY += 55;
                  });
                }
            };

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)'; ctx.beginPath(); ctx.moveTo(80, height - 140); ctx.lineTo(width - 80, height - 140); ctx.stroke();

            const drawFooterLogoAndHandle = () => {
              const footerY = height - 70; const avatarX = 80;
              const renderLogoCircle = (imgLogo = null) => {
                if (imgLogo) {
                  ctx.save();
                  ctx.beginPath(); ctx.arc(avatarX + 35, footerY - 10, 35, 0, Math.PI * 2); ctx.clip();
                  const lRatio = imgLogo.width / imgLogo.height;
                  let lW = 70, lH = 70, lX = avatarX, lY = footerY - 45;
                  if (lRatio > 1) { lW = 70 * lRatio; lX = avatarX - (lW - 70) / 2; }
                  else { lH = 70 / lRatio; lY = (footerY - 45) - (lH - 70) / 2; }
                  ctx.drawImage(imgLogo, lX, lY, lW, lH);
                  ctx.restore();
                } else {
                  ctx.fillStyle = brandColor; ctx.beginPath(); ctx.arc(avatarX + 35, footerY - 10, 35, 0, Math.PI * 2); ctx.fill();
                  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 24px system-ui'; ctx.textAlign = 'center';
                  ctx.fillText(instagramHandle.substring(1, 3).toUpperCase(), avatarX + 35, footerY - 2); ctx.textAlign = 'left';
                }
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 32px system-ui';
                ctx.fillText(instagramHandle, avatarX + 90, footerY);

                if (slideIndex < slides.length - 1) {
                  ctx.fillStyle = brandColor; ctx.font = 'bold 32px system-ui'; ctx.textAlign = 'right';
                  ctx.fillText('ĎALEJ 👉', width - 80, footerY); ctx.textAlign = 'left';
                }
              };
              if (avatarPreview) {
                if (imageCache.current[avatarPreview]) { renderLogoCircle(imageCache.current[avatarPreview]); }
                else { const imgL = new Image(); imgL.src = avatarPreview; imgL.onload = () => { imageCache.current[avatarPreview] = imgL; renderLogoCircle(imgL); }; }
              } else { renderLogoCircle(null); }
            };

            drawImageWithPromise().then(() => {
              renderTextBlock(); drawFooterLogoAndHandle();
              if (callback) callback();
            });
          };

          useEffect(() => { drawSlideToCanvas(activeIndex); }, [activeIndex, slides, instagramHandle, brandColor, bgColor, avatarPreview]);

          const triggerDownload = (idx) => {
            canvasRef.current.toBlob((blob) => {
              if (!blob) return;
              const url = URL.createObjectURL(blob);
              const link = document.createElement('a');
              link.download = `slide_${idx + 1}.png`;
              link.href = url;
              document.body.appendChild(link);
              link.click();
              setTimeout(() => { document.body.removeChild(link); URL.revokeObjectURL(url); }, 100);
            }, 'image/png', 1.0);
          };

          return (
            <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col no-scrollbar">
              <header className="bg-slate-950 px-4 py-3 border-b border-slate-800 flex items-center justify-between sticky top-0 z-50">
                <div className="flex items-center space-x-2">
                  <div className="p-2 bg-gradient-to-tr from-amber-500 to-rose-500 rounded-lg text-white"><Icons.Instagram /></div>
                  <div><h1 className="text-sm font-black tracking-tight heading-font">InstaKarusel PRO</h1></div>
                </div>
              </header>

              <div className="flex-1 flex flex-col lg:flex-row overflow-y-auto">
                {/* PREVIEW */}
                <div className="p-4 bg-slate-900/40 border-b lg:border-r border-slate-800 flex flex-col items-center">
                  <div className="w-full max-w-[340px] aspect-[4/5] rounded-2xl overflow-hidden shadow-2xl border border-slate-700" style={{backgroundColor: bgColor}}>
                    <canvas ref={canvasRef} className="w-full h-full object-contain" />
                  </div>

                  <div className="flex items-center justify-between w-full max-w-[340px] mt-3 bg-slate-950 p-2 rounded-xl border border-slate-800">
                    <button onClick={() => setActiveIndex(p => Math.max(0, p - 1))} disabled={activeIndex === 0} className="p-2 bg-slate-900 hover:bg-slate-800 text-white rounded-lg disabled:opacity-20"><Icons.ArrowLeft /></button>
                    <span className="text-xs font-bold text-slate-400">Slide {activeIndex + 1} / {slides.length}</span>
                    <button onClick={() => setActiveIndex(p => Math.min(slides.length - 1, p + 1))} disabled={activeIndex === slides.length - 1} className="p-2 bg-slate-900 hover:bg-slate-800 text-white rounded-lg disabled:opacity-20"><Icons.ArrowRight /></button>
                  </div>

                  <button onClick={addBlankSlide}
                    className="w-full max-w-[340px] mt-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 py-2.5 rounded-xl text-xs font-bold flex items-center justify-center space-x-2 transition">
                    <Icons.Plus /> <span>PRIDAŤ PRÁZDNY SLIDE</span>
                  </button>

                  <button onClick={() => drawSlideToCanvas(activeIndex, () => triggerDownload(activeIndex))}
                    className="w-full max-w-[340px] mt-3 bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-xl text-xs font-bold flex items-center justify-center space-x-2 shadow-lg transition">
                    <Icons.Download /> <span>STIAHNUŤ TENTO SLIDE (PNG)</span>
                  </button>
                </div>

                {/* CONTROLS */}
                <div className="p-4 space-y-5 flex-1 max-w-xl mx-auto w-full pb-20">

                  {/* Nastavenie Profilu */}
                  <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3">
                    <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider heading-font">Nastavenie Profilu</h3>

                    {/* ✅ FIX: API Kľúč input — ukladá sa do localStorage, nikdy do kódu */}
                    <div>
                      <label className="block text-[10px] text-slate-400 mb-1 flex items-center space-x-1">
                        <span>🔑 GEMINI API KĽÚČ</span>
                        {apiKey && <span className="text-emerald-400 ml-2">✓ Nastavený</span>}
                      </label>
                      <div className="flex space-x-2">
                        <input
                          type={showApiKey ? "text" : "password"}
                          value={apiKey}
                          onChange={(e) => setApiKey(e.target.value)}
                          placeholder="Vlož sem tvoj Gemini API kľúč (AIza...)"
                          className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                        />
                        <button
                          onClick={() => setShowApiKey(v => !v)}
                          className="bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-slate-400"
                        >
                          {showApiKey ? "Skryť" : "Zobraziť"}
                        </button>
                      </div>
                      <p className="text-[9px] text-slate-500 mt-1">Kľúč sa ukladá len lokálne v prehliadači. Nikdy nejde na server.</p>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div className="col-span-2">
                        <label className="block text-[10px] text-slate-400 mb-1">PROFIL @HANDLE</label>
                        <input type="text" value={instagramHandle} onChange={(e) => setInstagramHandle(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white focus:outline-none" />
                      </div>
                      <div>
                        <label className="block text-[10px] text-slate-400 mb-1">DOPLNKOVÁ FARBA</label>
                        <input type="color" value={brandColor} onChange={(e) => setBrandColor(e.target.value)} className="w-full h-8 bg-slate-900 border border-slate-700 rounded cursor-pointer" />
                      </div>
                      <div>
                        <label className="block text-[10px] text-slate-400 mb-1">FARBA POZADIA</label>
                        <input type="color" value={bgColor} onChange={(e) => setBgColor(e.target.value)} className="w-full h-8 bg-slate-900 border border-slate-700 rounded cursor-pointer" />
                      </div>
                    </div>
                    <div>
                      <label className="block text-[10px] text-slate-400 mb-1">LOGO PROFILU</label>
                      <button onClick={() => fileInputRef.current.click()} className="w-full bg-slate-900 hover:bg-slate-800 border border-slate-700 rounded-lg py-2 text-xs font-bold flex items-center justify-center space-x-2 text-slate-300">
                        <Icons.Upload /> <span>{avatarPreview ? "Zmeniť logo z galérie" : "Nahrať logo z galérie"}</span>
                      </button>
                      <input type="file" ref={fileInputRef} onChange={handleAvatarChange} accept="image/*" className="hidden" />
                    </div>
                  </div>

                  {/* PUBMED */}
                  <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <button onClick={() => setIsPubMedOpen(!isPubMedOpen)} className="w-full flex items-center justify-between text-left">
                        <div className="flex items-center space-x-2"><Icons.Search /><h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider heading-font">Výskum & Fakty (PubMed)</h3></div>
                        {isPubMedOpen ? <Icons.ChevronUp /> : <Icons.ChevronDown />}
                    </button>

                    <div className={`collapse-content ${isPubMedOpen ? 'max-h-[1000px] mt-4 opacity-100' : 'max-h-0 opacity-0'}`}>
                        <div className="space-y-3">
                            <p className="text-[10px] text-slate-400">Preložíme tvoju tému do angličtiny, nájdeme štúdie a vytvoríme výťah faktov, ktoré skopíruješ do slidov.</p>
                            <div className="flex space-x-2">
                                <input type="text" placeholder="Napr. rast svalov po tréningu..." value={pubMedQuery} onChange={(e) => setPubMedQuery(e.target.value)} className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none" />
                                <button onClick={searchPubMed} disabled={isFetchingPubMed} className="bg-teal-600 hover:bg-teal-500 text-white text-xs px-3 rounded-lg font-bold">
                                    {isFetchingPubMed ? '⏳ Hľadám...' : 'Hľadať v NCBI'}
                                </button>
                            </div>

                            {pubMedOptimizedQuery && <p className="text-[9px] text-slate-500 italic">Preložený dopyt: {pubMedOptimizedQuery}</p>}
                            {apiError && <p className="text-xs text-rose-500 mt-2">{apiError}</p>}

                            {pubMedLinks.length > 0 && (
                                <div className="mt-3 p-3 bg-slate-900 border border-slate-700 rounded-lg">
                                    <p className="text-[10px] text-teal-400 font-bold mb-1">Zdrojové overené linky:</p>
                                    <ul className="list-disc pl-4 space-y-1">
                                        {pubMedLinks.map((link, idx) => (
                                            <li key={idx}><a href={link} target="_blank" rel="noreferrer" className="text-[10px] text-blue-400 hover:underline">{link}</a></li>
                                        ))}
                                    </ul>
                                </div>
                            )}

                            {pubMedResults && (
                                <div className="mt-3 p-3 bg-slate-900 border border-slate-700 rounded-lg">
                                    <p className="text-[10px] text-amber-400 font-bold mb-2">Pripravené fakty pre tvoj Slide (skopíruj si to):</p>
                                    {/* ✅ FIX: sanitizeHtml pred dangerouslySetInnerHTML (ochrana pred XSS) */}
                                    <div className="text-xs text-slate-300 space-y-2 leading-relaxed" style={{whiteSpace: "pre-line"}} dangerouslySetInnerHTML={{__html: sanitizeHtml(pubMedResults.replace(/\*\*(.*?)\*\*/g, '<span class="text-white font-bold">$1</span>'))}}></div>
                                </div>
                            )}
                        </div>
                    </div>
                  </div>

                  {/* AI Karusel Generátor */}
                  <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3">
                    <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider heading-font">AI Tvorba karuselu</h3>
                    <div className="flex space-x-2">
                      <input type="text" placeholder="Téma na 5 slidov (napr. Výhody spánku)" value={topic} onChange={(e) => setTopic(e.target.value)} className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none" />
                      <button onClick={generateWithAI} disabled={loading} className="bg-amber-600 hover:bg-amber-500 text-white text-xs px-4 py-2 rounded-lg font-bold">
                        {loading ? 'Generujem...' : 'Vygenerovať'}
                      </button>
                    </div>
                    {apiError && !isPubMedOpen && <p className="text-xs text-rose-500">{apiError}</p>}
                  </div>

                  {/* Editor */}
                  <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3">
                    <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider heading-font">Editor Slidu {activeIndex + 1}</h3>

                    <div className="space-y-1">
                      <label className="block text-[10px] text-slate-400">NADPIS</label>
                      <input type="text" value={editTitle} onChange={(e) => setEditTitle(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none" />
                    </div>

                    {slides[activeIndex]?.type === 'cover' ? (
                      <div className="space-y-1">
                        <label className="block text-[10px] text-slate-400">ODRÁŽKY</label>
                        <input type="text" value={editBullets} onChange={(e) => setEditBullets(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none" />
                      </div>
                    ) : (
                      <div className="space-y-1">
                        <label className="block text-[10px] text-slate-400">OBSAH (PRE BOLD POUŽI **SLOVO**)</label>
                        <textarea value={editContent} onChange={(e) => setEditContent(e.target.value)} rows={6} className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none" />
                      </div>
                    )}

                    {/* Vylepšený výber Layoutu a AI Obrázky */}
                    <div className="pt-3 border-t border-slate-800 space-y-3">
                      <div className="flex items-center justify-between">
                          <label className="block text-[10px] text-slate-400 font-bold">OBRÁZOK NA SLIDE (9-Mriežka)</label>
                      </div>

                      <select value={slides[activeIndex]?.imageLayout || 'none'} onChange={setSlideLayout} className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none">
                          {LAYOUT_OPTIONS.map(opt => <option key={opt.id} value={opt.id}>{opt.label}</option>)}
                      </select>

                      {slides[activeIndex]?.imageLayout !== 'none' && (
                        <div className="space-y-3 pt-2">
                          <div className="flex space-x-2">
                            <input type="text" placeholder="Prompt pre AI obrázok..." value={imagePrompt} onChange={(e) => setImagePrompt(e.target.value)} className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none" />
                            <button onClick={generateNanobananaImage} disabled={imgLoading} className="bg-fuchsia-600 hover:bg-fuchsia-500 text-white text-xs px-3 rounded-lg font-bold transition flex items-center space-x-1">
                              <Icons.Image /> <span>{imgLoading ? '...' : 'Generovať'}</span>
                            </button>
                          </div>

                          <button onClick={() => slideImageFileInputRef.current.click()} className="w-full bg-slate-900 hover:bg-slate-800 border border-slate-700 rounded-lg py-2 text-xs font-bold flex items-center justify-center space-x-2 text-slate-300">
                            <Icons.Upload /> <span>Nahrať vlastnú fotku z mobilu</span>
                          </button>
                          <input type="file" ref={slideImageFileInputRef} onChange={handleSlideImageUpload} accept="image/*" className="hidden" />
                        </div>
                      )}
                    </div>
                  </div>

                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
